name: Update OL fixtures data

on:
  schedule:
    - cron: "0 4 * * *" # taeglich ca. 05:00/06:00 Schweizer Zeit
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate fixtures data
        run: python3 update_data.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ geocode-cache.json
          git diff --cached --quiet || git commit -m "Update OL fixtures data"
          git push
