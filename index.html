<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>OL-Termine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>OL-Termine</h1>
  <div class="controls">
    <label>Jahr:
      <select id="year"></select>
    </label>
    <button id="reload">⟳ Daten laden</button>
    <span id="status"></span>
    <input type="search" id="search" placeholder="Suche nach Name, Veranstalter, Ort...">
  </div>
  <div class="filters-row">
    <fieldset class="filter-box">
      <legend>Gebiet</legend>
      <label><input type="checkbox" class="terrain-filter" value="wald" checked> 🌲 Wald</label>
      <label><input type="checkbox" class="terrain-filter" value="stadt" checked> 🏠 Stadt</label>
      <label><input type="checkbox" class="terrain-filter" value="mix" checked> 🏡 Mix</label>
      <label><input type="checkbox" class="terrain-filter" value="unbekannt" checked> ⋯ ohne Angabe</label>
    </fieldset>
    <button id="jom-btn" class="toggle-btn" type="button">Nur JOM-Läufe</button>
    <span class="radius-control">
      <input type="number" id="nearby-radius" min="1" max="500" step="5" value="50"> km
    </span>
    <button id="nearby-btn" class="toggle-btn" type="button">OL in der Nähe</button>
  </div>
  <div class="filters-row">
    <fieldset class="filter-box">
      <legend>Typ</legend>
      <label><input type="checkbox" class="type-filter" value="sm" checked> SM</label>
      <label><input type="checkbox" class="type-filter" value="nat" checked> Nat. OL</label>
      <label><input type="checkbox" class="type-filter" value="swisscup" checked> SwissCup</label>
      <label><input type="checkbox" class="type-filter" value="reg" checked> Reg. OL</label>
      <label><input type="checkbox" class="type-filter" value="mehrtaegig" checked> Mehrtägig</label>
      <label><input type="checkbox" class="type-filter" value="staffel" checked> Staffel</label>
      <label><input type="checkbox" class="type-filter" value="team" checked> Team-OL</label>
      <label><input type="checkbox" class="type-filter" value="adm" checked> Adm</label>
      <label><input type="checkbox" class="type-filter" value="sonstige" checked> Sonstige</label>
    </fieldset>
  </div>
</header>

<main>
  <section id="list-panel">
    <table id="events-table">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Region</th>
          <th>Name</th>
          <th>Veranstalter</th>
          <th>Gebiet</th>
          <th>D</th>
          <th>T</th>
          <th>Typ</th>
          <th>Karte</th>
          <th>ICS</th>
        </tr>
      </thead>
      <tbody id="events-body">
        <tr><td colspan="10" class="empty">Noch keine Daten geladen. "Daten laden" klicken.</td></tr>
      </tbody>
    </table>
  </section>

  <section id="map-panel">
    <h2 id="map-title">Karte</h2>
    <iframe id="map-frame" title="OL-Gebiet Karte" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <p id="map-hint">Auf "Karte" bei einem Termin klicken, um das Gebiet hier anzuzeigen.</p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
